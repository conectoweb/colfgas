<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="bgInd" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F7F8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="pipeSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="valvGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#287A1C" />
      <stop offset="100%" stop-color="#43BE24" />
    </linearGradient>
    <filter id="shadowInd" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#263238" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" rx="16" fill="url(#bgInd)" />

  <!-- Technical Grid -->
  <g opacity="0.15">
    <path d="M0 40h800M0 80h800M0 120h800M0 160h800M0 200h800M0 240h800M0 280h800M0 320h800M0 360h800M0 400h800M0 440h800" stroke="#287A1C" stroke-width="0.8" stroke-dasharray="4 4" />
    <path d="M40 0v480M80 0v480M120 0v480M160 0v480M200 0v480M240 0v480M280 0v480M320 0v480M360 0v480M400 0v480M440 0v480M480 0v480M520 0v480M560 0v480M600 0v480M640 0v480M680 0v480M720 0v480M760 0v480" stroke="#287A1C" stroke-width="0.8" stroke-dasharray="4 4" />
  </g>

  <!-- Plant Foundation Slab -->
  <rect x="40" y="380" width="720" height="60" rx="8" fill="#CBD5E1" />
  <rect x="40" y="380" width="720" height="10" fill="#94A3B8" />
  <text x="55" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">LOSA INDUSTRIAL / PLANTA DE PROCESOS (CÓDIGO ASME B31.8 / NTC 3838)</text>

  <!-- Industrial ERM Station Skid Enclosure (Estación de Regulación y Medición) -->
  <g filter="url(#shadowInd)">
    <!-- Skid frame -->
    <rect x="70" y="160" width="310" height="210" rx="10" fill="#FFFFFF" stroke="#0066B3" stroke-width="2" />
    <rect x="70" y="160" width="310" height="32" rx="10" fill="#263238" />
    <rect x="70" y="182" width="310" height="10" fill="#263238" />
    <text x="85" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">ESTACIÓN ERM • REGULACIÓN PRIMARIA Y FILTRADO</text>

    <!-- High-Pressure Inflow Pipe (Acero al Carbón Cédula 80) -->
    <path d="M40 250h60" stroke="#007afd" stroke-width="12" stroke-linecap="round" />
    <rect x="95" y="238" width="8" height="24" rx="2" fill="#334155" />

    <!-- Filter Separator Vessel -->
    <rect x="110" y="220" width="36" height="60" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="2" />
    <text x="114" y="254" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#334155">FILTRO</text>

    <!-- Slam-Shut Safety Valve (OPSO) -->
    <path d="M146 250h25" stroke="url(#pipeSteel)" stroke-width="10" />
    <polygon points="175,238 190,250 175,262" fill="#DC2626" stroke="#991B1B" stroke-width="1.5" />
    <polygon points="205,238 190,250 205,262" fill="#DC2626" stroke="#991B1B" stroke-width="1.5" />
    <circle cx="190" cy="250" r="4" fill="#FFFFFF" />
    <!-- Solenoid head -->
    <rect x="186" y="222" width="8" height="16" fill="#1E293B" />
    <text x="160" y="215" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#DC2626">VÁLVULA OPSO</text>

    <!-- Pressure Regulator 1st Stage -->
    <path d="M205 250h20" stroke="url(#pipeSteel)" stroke-width="10" />
    <circle cx="240" cy="250" r="18" fill="#F1F5F9" stroke="#0066B3" stroke-width="2.5" />
    <circle cx="240" cy="250" r="7" fill="#43BE24" />
    <path d="M240 232v-12" stroke="#0066B3" stroke-width="2" />
    <!-- Dial gauge -->
    <circle cx="240" cy="214" r="8" fill="#FFFFFF" stroke="#263238" stroke-width="1.5" />
    <line x1="240" y1="214" x2="244" y2="210" stroke="#DC2626" stroke-width="1.5" />

    <!-- Turbine Flow Meter (Medición Fiscal/Operativa) -->
    <path d="M258 250h30" stroke="url(#pipeSteel)" stroke-width="10" />
    <rect x="288" y="235" width="40" height="30" rx="4" fill="#1E293B" stroke="#007afd" stroke-width="2" />
    <rect x="294" y="240" width="28" height="12" fill="#0284C7" />
    <text x="297" y="249" font-family="monospace" font-size="8" font-weight="700" fill="#FFFFFF">0482 m³</text>
    <text x="293" y="280" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0066B3">MEDIDOR</text>

    <!-- Outflow to Plant Distribution -->
    <path d="M328 250h60" stroke="#43BE24" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Pipe Bridge to Factory Equipment -->
  <path d="M388 250h60v-90c0-6 4-10 10-10h70" stroke="url(#pipeSteel)" stroke-width="10" fill="none" stroke-linejoin="round" />
  <!-- Structural Pipe Supports -->
  <line x1="450" y1="250" x2="450" y2="380" stroke="#64748B" stroke-width="4" />
  <line x1="440" y1="380" x2="460" y2="380" stroke="#334155" stroke-width="4" />

  <!-- Industrial Boiler & Burner Unit (Caldera / Horno Térmico) -->
  <g filter="url(#shadowInd)">
    <!-- Equipment Housing -->
    <rect x="520" y="100" width="220" height="270" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect x="520" y="100" width="220" height="34" rx="14" fill="#287A1C" />
    <rect x="520" y="124" width="220" height="10" fill="#287A1C" />
    <text x="535" y="122" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">CALDERA / PROCESO TÉRMICO</text>

    <!-- Pressure Vessel Cylindrical Drum -->
    <rect x="545" y="150" width="170" height="90" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
    <!-- Pressure Level Sight Gauge -->
    <rect x="690" y="160" width="12" height="70" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1" />
    <line x1="696" y1="180" x2="696" y2="215" stroke="#0284C7" stroke-width="3" />

    <!-- Burner Flame Port -->
    <circle cx="630" cy="275" r="30" fill="#1E293B" stroke="#64748B" stroke-width="3" />
    <!-- Dynamic Industrial Flame -->
    <path d="M630 252c-8 10-14 20-8 30 4 6 12 8 16 2 6-8 2-18-8-32z" fill="#007afd" />
    <path d="M630 262c-4 5-8 11-4 17 2 3 7 4 9 1 4-5 1-10-5-18z" fill="#43BE24" />

    <!-- Burner Train Solenoid Block -->
    <rect x="545" y="260" width="45" height="30" rx="4" fill="#F1F5F9" stroke="#007afd" stroke-width="1.5" />
    <text x="550" y="278" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#0066B3">TREN GAS</text>

    <!-- Gas Sensor Leak Detector Module -->
    <rect x="540" y="320" width="180" height="38" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="558" cy="339" r="6" fill="#D97706" />
    <text x="572" y="337" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#92400E">DETECCIÓN AUTOMÁTICA</text>
    <text x="572" y="349" font-family="system-ui, sans-serif" font-size="9" fill="#B45309">Corte por electroválvula certificada</text>
  </g>

  <!-- Left Technical Specs Badge -->
  <g filter="url(#shadowInd)">
    <rect x="70" y="50" width="310" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="70" y="50" width="8" height="90" rx="4" fill="#287A1C" />
    <text x="90" y="73" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#263238">PARÁMETROS TÉCNICOS INDUSTRIALES</text>
    <text x="90" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Presión: Media Presión regulada (hasta 60 psig)</text>
    <text x="90" y="106" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Tubería: Acero ASTM A53 Gr. B / Polietileno PEAD</text>
    <text x="90" y="122" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#287A1C">• Cumplimiento: NTC 3838 / NTC 4282 / ASME B31.8</text>
  </g>

  <!-- Watermark badge -->
  <rect x="420" y="60" width="240" height="26" rx="6" fill="#F4F7F8" stroke="#CBD5E1" stroke-width="1" />
  <text x="430" y="77" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0066B3">[ESQUEMA TÉCNICO PROVISIONAL COLFGAS]</text>
</svg>
