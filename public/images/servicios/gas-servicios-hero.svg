<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="bgServ" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F7F8" />
      <stop offset="100%" stop-color="#EBF1F5" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066B3" />
      <stop offset="100%" stop-color="#007afd" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#287A1C" />
      <stop offset="100%" stop-color="#43BE24" />
    </linearGradient>
    <filter id="shadowServ" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#263238" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" rx="16" fill="url(#bgServ)" />

  <!-- Technical Grid -->
  <g opacity="0.16">
    <path d="M0 40h800M0 80h800M0 120h800M0 160h800M0 200h800M0 240h800M0 280h800M0 320h800M0 360h800M0 400h800M0 440h800" stroke="#0066B3" stroke-width="0.8" stroke-dasharray="4 4" />
    <path d="M40 0v480M80 0v480M120 0v480M160 0v480M200 0v480M240 0v480M280 0v480M320 0v480M360 0v480M400 0v480M440 0v480M480 0v480M520 0v480M560 0v480M600 0v480M640 0v480M680 0v480M720 0v480M760 0v480" stroke="#0066B3" stroke-width="0.8" stroke-dasharray="4 4" />
  </g>

  <!-- Distribution Pipeline Network Backbone (Underground Strata) -->
  <rect x="40" y="380" width="720" height="60" rx="8" fill="#CBD5E1" />
  <rect x="40" y="380" width="720" height="8" fill="#94A3B8" />
  <path d="M60 425h680" stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round" />
  <text x="55" y="405" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">INFRAESTRUCTURA DE REDES DE GAS COLOMBIA • DISEÑO, CONSTRUCCIÓN Y MANTENIMIENTO</text>

  <!-- Left Side: Residential Sector Card -->
  <g filter="url(#shadowServ)">
    <rect x="60" y="70" width="320" height="280" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="60" y="70" width="320" height="38" rx="14" fill="#0066B3" />
    <rect x="60" y="96" width="320" height="12" fill="#0066B3" />
    <text x="80" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1. SECTOR RESIDENCIAL Y MULTIFAMILIAR</text>

    <!-- Visual Architectural Mini Building -->
    <rect x="80" y="125" width="90" height="135" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Building Floors & Windows -->
    <rect x="90" y="138" width="20" height="22" rx="2" fill="#E2E8F0" />
    <rect x="120" y="138" width="20" height="22" rx="2" fill="#E2E8F0" />
    <rect x="90" y="170" width="20" height="22" rx="2" fill="#E2E8F0" />
    <rect x="120" y="170" width="20" height="22" rx="2" fill="#E2E8F0" />
    <rect x="90" y="202" width="20" height="22" rx="2" fill="#E2E8F0" />
    <rect x="120" y="202" width="20" height="22" rx="2" fill="#E2E8F0" />
    <!-- Meter Bank Ground -->
    <rect x="85" y="235" width="80" height="20" rx="3" fill="#007afd" />
    <text x="92" y="249" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">MEDIDORES</text>

    <!-- Riser Pipeline -->
    <path d="M170 245h15v-100h20" stroke="#007afd" stroke-width="3" fill="none" stroke-linejoin="round" />

    <!-- Text Specifications -->
    <text x="185" y="142" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#263238">Norma NTC 2505</text>
    <text x="185" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Redes matrices verticales</text>
    <text x="185" y="178" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Centros de medición unificados</text>
    <text x="185" y="196" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Tubería PE-AL-PE y cobre</text>
    <text x="185" y="214" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Calentadores, estufas y hornos</text>

    <!-- Bottom Pill -->
    <rect x="80" y="280" width="280" height="26" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
    <text x="95" y="297" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0066B3">100% HERMETICIDAD CON MANÓMETRO CALIBRADO</text>
  </g>

  <!-- Right Side: Industrial Sector Card -->
  <g filter="url(#shadowServ)">
    <rect x="420" y="70" width="320" height="280" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="420" y="70" width="320" height="38" rx="14" fill="#287A1C" />
    <rect x="420" y="96" width="320" height="12" fill="#287A1C" />
    <text x="440" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2. SECTOR INDUSTRIAL Y COMERCIAL</text>

    <!-- Visual Industrial Plant / ERM Skid -->
    <rect x="440" y="125" width="100" height="135" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Industrial Shed Roof -->
    <polygon points="440,140 490,125 540,140" fill="#475569" />
    <!-- ERM Skid inside -->
    <rect x="450" y="155" width="80" height="40" rx="4" fill="#E2E8F0" stroke="#0066B3" stroke-width="1.5" />
    <text x="457" y="178" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0066B3">SKID ERM</text>
    <!-- Boiler symbol -->
    <circle cx="490" cy="225" r="18" fill="#1E293B" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M490 215c-3 4-5 8-3 12 2 3 5 4 7 1 3-3 1-8-4-13z" fill="#43BE24" />

    <!-- Text Specifications -->
    <text x="555" y="142" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#263238">Norma NTC 3838</text>
    <text x="555" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Media y alta presión</text>
    <text x="555" y="178" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Estaciones ERM y OPSO</text>
    <text x="555" y="196" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Tubería acero Cédula 40/80</text>
    <text x="555" y="214" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">• Trenes de gas para calderas</text>

    <!-- Bottom Pill -->
    <rect x="440" y="280" width="280" height="26" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
    <text x="455" y="297" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#287A1C">CONTINUIDAD TÉRMICA Y MÁXIMA SEGURIDAD</text>
  </g>

  <!-- Connective Pipe Line between underground and cards -->
  <path d="M220 425v-45c0-10 6-18 16-18h40" stroke="#007afd" stroke-width="4" stroke-dasharray="4 4" fill="none" />
  <circle cx="220" cy="425" r="5" fill="#007afd" />

  <path d="M580 425v-45c0-10 -6-18 -16-18h-40" stroke="#43BE24" stroke-width="4" stroke-dasharray="4 4" fill="none" />
  <circle cx="580" cy="425" r="5" fill="#43BE24" />

  <!-- Center Badge: Transparent Notice -->
  <g filter="url(#shadowServ)">
    <rect x="260" y="18" width="280" height="32" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="276" cy="34" r="5" fill="#0066B3" />
    <text x="288" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#263238">COLFGAS • REDES FIJAS DE GAS</text>
    <text x="460" y="38" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B">[ESQUEMA TÉCNICO]</text>
  </g>
</svg>
