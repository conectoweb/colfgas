<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="bgRes" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F7F8" />
      <stop offset="100%" stop-color="#EBF1F5" />
    </linearGradient>
    <linearGradient id="bluePipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066B3" />
      <stop offset="100%" stop-color="#007afd" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#287A1C" />
      <stop offset="100%" stop-color="#43BE24" />
    </linearGradient>
    <filter id="shadowRes" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#263238" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" rx="16" fill="url(#bgRes)" />

  <!-- Blueprint Engineering Grid Pattern -->
  <g opacity="0.18">
    <path d="M0 40h800M0 80h800M0 120h800M0 160h800M0 200h800M0 240h800M0 280h800M0 320h800M0 360h800M0 400h800M0 440h800" stroke="#0066B3" stroke-width="0.8" stroke-dasharray="4 4" />
    <path d="M40 0v480M80 0v480M120 0v480M160 0v480M200 0v480M240 0v480M280 0v480M320 0v480M360 0v480M400 0v480M440 0v480M480 0v480M520 0v480M560 0v480M600 0v480M640 0v480M680 0v480M720 0v480M760 0v480" stroke="#0066B3" stroke-width="0.8" stroke-dasharray="4 4" />
  </g>

  <!-- Ground Plane & Underground Strata -->
  <rect x="40" y="380" width="720" height="60" rx="8" fill="#E2E8F0" />
  <rect x="40" y="380" width="720" height="8" fill="#CBD5E1" />
  <!-- Sidewalk Texture -->
  <path d="M40 380h720" stroke="#94A3B8" stroke-width="2" />
  <text x="55" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">RED MATRIZ PÚBLICA SUBTERRÁNEA (PEAD / ACERO)</text>

  <!-- Public Gas Main under street -->
  <path d="M50 435h240" stroke="#007afd" stroke-width="8" stroke-linecap="round" />
  <circle cx="290" cy="435" r="7" fill="#43BE24" stroke="#FFFFFF" stroke-width="2" />
  <!-- Service Tap (Acometida) -->
  <path d="M290 435v-45c0-6 4-10 10-10h40" stroke="url(#bluePipe)" stroke-width="5" stroke-linecap="round" />

  <!-- Multi-Story Residential Building Profile -->
  <g filter="url(#shadowRes)">
    <rect x="330" y="60" width="410" height="320" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

    <!-- Building Top Parapet / Roofline -->
    <rect x="320" y="50" width="430" height="14" rx="4" fill="#263238" />

    <!-- Floor Dividers -->
    <line x1="330" y1="140" x2="740" y2="140" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 4" />
    <line x1="330" y1="220" x2="740" y2="220" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 4" />
    <line x1="330" y1="300" x2="740" y2="300" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 4" />

    <!-- Floor Labels -->
    <text x="345" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">PISO 3 (ÁTICO / DÚPLEX)</text>
    <text x="345" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">PISO 2 (UNIDADES MULTIFAMILIARES)</text>
    <text x="345" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">PISO 1 (VIVIENDA Y COMERCIO)</text>
    <text x="345" y="345" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0066B3">GABINETE DE MEDIDORES (NTC 2505)</text>

    <!-- Meter Battery Cabinet Ground Floor -->
    <rect x="360" y="325" width="130" height="45" rx="6" fill="#F8FAFC" stroke="#0066B3" stroke-width="2" />
    <!-- Individual Meters in Cabinet -->
    <circle cx="380" cy="347" r="9" fill="#FFFFFF" stroke="#007afd" stroke-width="2" />
    <circle cx="410" cy="347" r="9" fill="#FFFFFF" stroke="#007afd" stroke-width="2" />
    <circle cx="440" cy="347" r="9" fill="#FFFFFF" stroke="#007afd" stroke-width="2" />
    <circle cx="470" cy="347" r="9" fill="#FFFFFF" stroke="#43BE24" stroke-width="2" />

    <!-- Main Vertical Riser Pipe (Montante Vertical) -->
    <path d="M485 347h25v-255" stroke="url(#bluePipe)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Floor 1 Branch & Appliances -->
    <path d="M510 270h120" stroke="#007afd" stroke-width="3" stroke-linecap="round" />
    <rect x="630" y="250" width="35" height="35" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Stove icon -->
    <path d="M638 275h19M643 262a4 4 0 0 1 8 0" stroke="#007afd" stroke-width="2" stroke-linecap="round" />
    <circle cx="642" cy="270" r="2" fill="#43BE24" />
    <circle cx="652" cy="270" r="2" fill="#43BE24" />
    <text x="670" y="272" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#263238">Cocina / Estufa</text>

    <!-- Floor 2 Branch & Water Heater -->
    <path d="M510 190h120" stroke="#007afd" stroke-width="3" stroke-linecap="round" />
    <rect x="630" y="165" width="30" height="45" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Water heater flame -->
    <path d="M645 185c0-4 4-8 4-8s4 4 4 8a4 4 0 0 1-8 0z" fill="#007afd" />
    <text x="668" y="192" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#263238">Calentador de Paso</text>

    <!-- Floor 3 Branch & Multiple Points -->
    <path d="M510 110h120" stroke="#007afd" stroke-width="3" stroke-linecap="round" />
    <circle cx="635" cy="110" r="8" fill="#43BE24" />
    <path d="M632 110l2 2 4-4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="650" y="113" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#263238">Puntos Certificados NTC 2505</text>
  </g>

  <!-- Left Technical Annotation Card -->
  <g filter="url(#shadowRes)">
    <rect x="50" y="70" width="250" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Card Header -->
    <rect x="50" y="70" width="250" height="42" rx="12" fill="#263238" />
    <rect x="50" y="98" width="250" height="14" fill="#263238" />
    <text x="68" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ESPECIFICACIÓN TÉCNICA</text>

    <!-- Items -->
    <circle cx="72" cy="135" r="4" fill="#007afd" />
    <text x="85" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#263238">Norma Aplicable: NTC 2505</text>
    <text x="85" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">Redes de gas en edificaciones</text>

    <circle cx="72" cy="180" r="4" fill="#43BE24" />
    <text x="85" y="183" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#263238">Materiales Homologados</text>
    <text x="85" y="197" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">PE-AL-PE, Cobre Tipo L, Acero</text>

    <circle cx="72" cy="225" r="4" fill="#0066B3" />
    <text x="85" y="228" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#263238">Pruebas de Hermeticidad</text>
    <text x="85" y="242" font-family="system-ui, sans-serif" font-size="10" fill="#5B6570">Cero caídas de presión / 100% estanco</text>

    <!-- Client Notice Badge -->
    <rect x="65" y="262" width="220" height="26" rx="6" fill="#F4F7F8" stroke="#CBD5E1" stroke-width="1" />
    <text x="75" y="279" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0066B3">[ESQUEMA TÉCNICO PROVISIONAL COLFGAS]</text>
  </g>

  <!-- Technical Callout Lines with dots -->
  <circle cx="340" cy="350" r="5" fill="#0066B3" stroke="#FFFFFF" stroke-width="2" />
  <path d="M340 350h-40v-30" stroke="#0066B3" stroke-width="1.5" stroke-dasharray="3 3" />
  <rect x="235" y="305" width="95" height="22" rx="4" fill="#0066B3" />
  <text x="242" y="320" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Batería Central</text>
</svg>
